<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Poppins", sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.login-box{
    background:rgba(255,255,255,.1);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    padding:40px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
    color:#fff;
}

.login-box h2{
    text-align:center;
    margin-bottom:10px;
    font-size:32px;
}

.login-box p{
    text-align:center;
    color:#d6d6d6;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:500;
}

.input-box input{
    width:100%;
    padding:14px 15px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,.15);
    color:#fff;
    font-size:15px;
    transition:.3s;
}

.input-box input::placeholder{
    color:#ddd;
}

.input-box input:focus{
    background:rgba(255,255,255,.22);
    border:1px solid #60a5fa;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    font-size:14px;
}

.options label{
    display:flex;
    align-items:center;
    gap:6px;
}

.options a{
    color:#93c5fd;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

.signup{
    text-align:center;
    margin-top:20px;
    color:#ddd;
}

.signup a{
    color:#60a5fa;
    text-decoration:none;
    font-weight:600;
}

.signup a:hover{
    text-decoration:underline;
}

@media(max-width:480px){

.login-box{
    padding:30px 25px;
}

.login-box h2{
    font-size:28px;
}

}
</style>

</head>
<body>

<div class="container">

    <div class="login-box">

        <h2>Welcome Back 👋</h2>
        <p>Login to continue your journey.</p>

        <form action="/login" method="POST">

            <div class="input-box">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <div class="signup">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
